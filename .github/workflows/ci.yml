name: PetClinic CI & Load Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build Application
      run: ./mvnw clean package -DskipTests

    - name: Run Spring Boot in Background
      run: |
        nohup ./mvnw spring-boot:run > spring.log 2>&1 &
        
    - name: Wait for Spring Boot to start
      run: |
        npx wait-on http://localhost:8080/ --timeout 120000

    - name: Run k6 Load Test
      uses: grafana/k6-action@v0.3.0
      with:
        filename: load-test.js
        flags: --network host

    - name: Stop Spring Boot
      if: always()
      run: pkill -f 'spring-boot' || true
name: PetClinic CI & Load Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build Application
      run: ./mvnw clean package -DskipTests

    - name: Run Spring Boot in Background
      run: |
        nohup ./mvnw spring-boot:run > spring.log 2>&1 &
        
    - name: Wait for Spring Boot to start
      run: |
        npx wait-on http://localhost:8080/ --timeout 120000

    - name: Install and Run k6 Load Test
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install -y k6
        k6 run load-test.js

    - name: Stop Spring Boot
      if: always()
      run: pkill -f 'spring-boot' || true